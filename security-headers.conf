# En-tetes de securite, inclus dans CHAQUE location : nginx n'herite pas les
# add_header d'un niveau parent des qu'un add_header existe au niveau courant.
# Les regrouper ici evite de les oublier sur une reponse (notamment le HTML).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

# CSP calibree sur le code et verifiee sur l'image locale (console sans
# violation, partie jouable). Les trois miroirs Overpass sont autorises pour le
# fallback runtime de src/lib/osm.ts, qui ne sert que si les JSON de public/
# manquent. 'unsafe-inline' en style-src couvre les style attributes poses par
# React sur le HUD.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
