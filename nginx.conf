# Service du SPA Vite. Traefik (gere par Dokploy) termine le TLS en amont et
# transmet le trafic en clair a ce conteneur sur le port 80.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Les .gz sont fabriques au build (voir Dockerfile) : nginx les sert tels
  # quels quand le client accepte gzip, et retombe sur la compression a la
  # volee pour tout le reste.
  gzip_static on;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml;

  # Donnees OSM cachees dans public/ : servies a la racine, sans hash dans le
  # nom, donc un cache long les figerait apres un refetch Overpass. Une heure,
  # puis revalidation par ETag (nginx en pose un tout seul).
  location ~ \.(json|geojson)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri =404;
  }

  # Assets hashes par Vite (js, css, polices) : immuables, cache long.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Salon multi : Node ecoute en local, nginx transmet l'upgrade WebSocket.
  location /ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
  }

  # Point d'entree SPA : tout le reste retombe sur index.html, jamais mis en
  # cache pour qu'un nouveau deploiement soit pris en compte immediatement.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
